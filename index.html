<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0D12" />
  <meta name="description" content="Brunian Lifts — a personal strength ledger with scoring, cloud sync, exercise bank, program editing, weekly coaching, charts and PR history." />
  <link rel="canonical" href="https://brunomartins7.github.io/lifts/" />
  <meta property="og:url" content="https://brunomartins7.github.io/lifts/" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Brunian Lifts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Tokens live in tokens.css — the single source of truth, shared with
       design-language.html. No palette colour may be declared below this line:
       use a token, or rgba(var(--x-rgb),a) for a translucent variant. The only
       raw values left are neutral black shadows and a few component-local
       gradient stops that exist once each. */
    *{box-sizing:border-box}
    html{scrollbar-color:var(--panel3) var(--bg);scroll-behavior:auto}
    html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    body{background:
      radial-gradient(ellipse 56% 30% at 18% -6%,rgba(var(--gold-rgb),.11),transparent),
      radial-gradient(ellipse 40% 24% at 100% 2%,rgba(var(--ink-rgb),.03),transparent),
      linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);
      background-attachment:fixed}
    ::selection{background:rgba(var(--gold-rgb),.32)}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:6px;border:2px solid var(--bg)}
    button,input,textarea,select{font:inherit;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:0;background:none;padding:0}
    input,textarea,select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm);padding:11px 12px;width:100%;transition:border-color .15s var(--e),background .15s var(--e)}
    input:hover,textarea:hover{border-color:var(--line2)}
    input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    ::placeholder{color:var(--faint)}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

    .shell{max-width:620px;margin:0 auto;min-height:100vh;padding:10px 16px calc(var(--navh) + 22px + env(safe-area-inset-bottom))}
    .shell.has-finish{padding-bottom:calc(160px + env(safe-area-inset-bottom))}

    /* ============ Header (mobile: slim top bar) ============ */
    .head{position:sticky;top:0;z-index:60;padding:10px 0;margin:0 -16px;background:linear-gradient(180deg,rgba(var(--bg-rgb),.97) 55%,rgba(var(--bg-rgb),.82) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .appbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--gold2);border:1px solid var(--goldDim);background:linear-gradient(150deg,rgba(var(--gold-rgb),.22),rgba(var(--ink-rgb),.03));box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.09),0 8px 20px rgba(0,0,0,.35);flex:0 0 auto}
    .mark svg{width:23px;height:23px;fill:var(--gold2);stroke:var(--gold2)}
    .bt{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.1px;line-height:1.1}
    .bt span{color:var(--gold2);font-style:italic}
    .bs{margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .ovr-mini{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:rgba(var(--panel-rgb),.85)}
    .ovr-mini span{font-size:9.5px;letter-spacing:1.4px;color:var(--faint);font-weight:800}
    .ovr-mini b{font-family:var(--mono);font-size:17px}
    .sync-chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--panel);transition:border-color .15s var(--e)}
    .sync-chip:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
    .sync-chip.ok{color:var(--ok);border-color:rgba(var(--ok-rgb),.35)}.sync-chip.ok:before{background:var(--ok)}
    .sync-chip.busy{color:var(--gold2);border-color:var(--goldDim)}.sync-chip.busy:before{background:var(--gold2);animation:pulse 1s infinite}
    .sync-chip.err{color:var(--risk);border-color:rgba(var(--risk-rgb),.4)}.sync-chip.err:before{background:var(--risk)}
    .sync-chip.blk{color:var(--gold2);border-color:var(--goldDim)}.sync-chip.blk:before{background:var(--gold2)}
    @keyframes pulse{50%{opacity:.35}}

    /* ============ Nav: bottom tab bar on mobile ============ */
    .nav{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;gap:2px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(var(--bg-top-rgb),.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    .nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:var(--faint);font-size:10px;font-weight:800;letter-spacing:.3px;padding:7px 2px;min-height:46px;transition:color .15s var(--e),background .15s var(--e)}
    .nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .nav button .nav-l{font-size:10px;line-height:1}
    .nav button.active{color:var(--gold2);background:var(--goldGhost)}
    .nav--session{display:none}

    .toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:220;max-width:92vw;border:1px solid var(--goldDim);border-radius:var(--r-md);background:var(--panel2);box-shadow:0 18px 44px var(--shadow);padding:11px 15px;font-size:13px;text-align:center;animation:fade .2s var(--e)}
    .toast-undo{color:var(--gold2);font-weight:800;text-decoration:underline;margin-left:6px}
    .banner{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r-md);background:var(--panel);padding:13px 15px;margin-top:12px;font-size:13px;line-height:1.5}
    .banner strong{display:block;margin-bottom:3px}
    .banner.warn{border-left-color:var(--gold)}
    .banner.bad{border-left-color:var(--risk)}

    /* ============ Hero / typography ============ */
    .hero{margin-top:13px;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 20px;background:linear-gradient(158deg,rgba(var(--panel3-rgb),.5),rgba(var(--panel-rgb),.97));box-shadow:0 26px 60px rgba(0,0,0,.30),inset 0 1px 0 rgba(var(--ink-rgb),.04);position:relative;overflow:hidden}
    .hero:before{content:"";position:absolute;right:-70px;top:-80px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(var(--gold-rgb),.14),transparent 70%);pointer-events:none}
    .eyebrow{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold2);font-weight:800}
    .title{margin-top:7px;font-family:var(--disp);font-weight:600;font-size:31px;line-height:1.05;letter-spacing:.1px;position:relative}
    .title em{font-style:italic;color:var(--gold2)}
    .sub{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.55;position:relative;max-width:48ch}
    .level-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative}
    .level{font-family:var(--mono);font-size:58px;line-height:.95;font-weight:700;letter-spacing:-2px}
    .rank{border:1px solid currentColor;border-radius:999px;padding:6px 11px;font-size:10.5px;font-weight:800;letter-spacing:.4px;white-space:nowrap;flex:0 0 auto;background:rgba(var(--bg-rgb),.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .section{margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
    .section h2{margin:0;font-family:var(--disp);font-weight:600;font-style:italic;color:var(--ink2);font-size:16.5px;letter-spacing:.2px}
    .section span{color:var(--faint);font-size:11.5px;text-align:right}

    /* ============ Buttons / cards ============ */
    .primary{display:block;width:100%;margin-top:16px;border-radius:var(--r-md);padding:15px 14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);font-weight:800;letter-spacing:.1px;box-shadow:0 12px 26px rgba(var(--gold-rgb),.22),inset 0 1px 0 rgba(255,255,255,.25);position:relative;min-height:48px;transition:filter .15s var(--e),transform .12s var(--e)}
    .primary.tight{width:auto;margin:0;padding:11px 16px;min-height:42px}
    .secondary{border:1px solid var(--line);background:var(--panel2);border-radius:var(--r-sm);padding:10px 13px;font-weight:700;font-size:13px;min-height:40px;transition:border-color .15s var(--e),background .15s var(--e)}
    .secondary.gold{background:var(--goldGhost);border-color:var(--goldDim);color:var(--gold2)}
    .secondary.danger{border-color:rgba(var(--risk-rgb),.4);color:var(--risk);background:var(--riskDim)}
    .secondary.block{display:block;width:100%;margin-top:9px}
    .danger-solid{background:var(--risk);color:var(--risk-ink);border-radius:var(--r-sm);padding:11px 16px;font-weight:800;min-height:42px}
    .back{color:var(--muted);padding:8px 0 2px;font-size:13.5px;font-weight:600;transition:color .15s var(--e)}
    .card{border:1px solid var(--line);border-radius:var(--r-lg);background:rgba(var(--panel-rgb),.92);padding:16px;margin-top:12px;box-shadow:0 14px 34px rgba(0,0,0,.16),inset 0 1px 0 rgba(var(--ink-rgb),.03)}
    .card.flat{box-shadow:none;padding:8px 16px}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
    .grid2>*,.grid3>*,.level-head>div{min-width:0}
    .metric{border:1px solid var(--line);border-radius:var(--r-md);background:rgba(var(--panel-rgb),.82);padding:13px 11px;min-width:0}
    .num{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
    .lab{margin-top:6px;color:var(--faint);font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;white-space:nowrap}
    .small{font-size:12.5px;line-height:1.5}.muted{color:var(--muted)}.faint{color:var(--faint)}.mono{font-family:var(--mono)}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--soft)}
    .row:last-child{border-bottom:0}
    .pill{border:1px solid var(--goldDim);color:var(--gold2);background:rgba(var(--goldDim-rgb),.2);border-radius:999px;padding:8px 12px;font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}

    /* ============ Radar / legend ============ */
    .radar-wrap{margin-top:14px;display:grid;place-items:center}
    .radar{width:100%;max-width:370px;height:auto;overflow:visible}
    .radar text{font-family:var(--body);font-weight:800;letter-spacing:.5px;fill:var(--muted)}
    .radar .num{fill:var(--ink);font-family:var(--mono);font-size:11px;font-weight:700}
    .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:13px;margin-top:9px;color:var(--faint);font-size:11px}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}

    /* ============ Home extras ============ */
    .today-cta{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:16px;background:linear-gradient(155deg,rgba(var(--gold-rgb),.13),rgba(var(--panel-rgb),.9));padding:15px 17px;margin:8px 0 2px;transition:transform .12s var(--e),border-color .15s var(--e)}
    .today-cta:active{transform:scale(.99)}
    .today-cta strong{color:var(--gold2);font-size:14px;display:block;letter-spacing:.2px}
    .today-cta div{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
    .day{border:1px solid var(--line);border-radius:var(--r-md);background:rgba(var(--panel-rgb),.86);text-align:left;padding:13px;min-height:88px;transition:border-color .15s var(--e),background .15s var(--e),transform .12s var(--e)}
    .day.active{border-color:var(--goldDim);background:linear-gradient(165deg,rgba(var(--gold-rgb),.14),rgba(var(--panel-rgb),.95))}
    .daytop{color:var(--faint);font-size:10px;font-family:var(--mono);letter-spacing:.8px}
    .dayname{margin-top:4px;font-weight:800;font-size:13.5px}
    .body{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
    .body-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
    .tool{border:1px solid var(--line);border-radius:var(--r-md);background:rgba(var(--panel-rgb),.88);padding:14px;text-align:left;display:grid;gap:5px;min-height:84px;position:relative;transition:border-color .15s var(--e),background .15s var(--e),transform .12s var(--e)}
    .tool strong{font-size:13.5px}
    .tool span{color:var(--faint);font-size:11.5px;line-height:1.45}
    .tool-ic{display:block;margin-bottom:8px}
    .tool-ic svg{width:21px;height:21px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .calendar-title{align-items:flex-start}
    .calendar-nav{display:flex;align-items:center;gap:8px;color:var(--ink2);font-family:var(--mono);font-size:11px;font-weight:700;white-space:nowrap}
    .cal-nav{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:20px;color:var(--ink2)}
    .cal-nav:disabled,.calendar-key button:disabled{opacity:.3;cursor:default}
    .calendar-weekdays,.training-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .calendar-weekdays{margin:14px 0 7px;color:var(--faint);font-family:var(--mono);font-size:10px;font-weight:800;text-align:center}
    .cal-day{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:rgba(var(--panel2-rgb),.62);color:var(--muted);font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
    .cal-day b{font-weight:600}.cal-day i{position:absolute;right:4px;bottom:3px;display:grid;place-items:center;min-width:13px;height:13px;border-radius:999px;background:var(--gold-ink);color:var(--gold2);font-size:8px;font-style:normal;font-weight:800}
    .cal-day.trained{border-color:var(--gold);background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--gold-ink);box-shadow:0 5px 14px rgba(var(--gold-rgb),.18)}
    .cal-day.today{box-shadow:0 0 0 2px var(--ink) inset}.cal-day.future{opacity:.35}.cal-day.outside{visibility:hidden}
    .calendar-key{display:flex;align-items:center;justify-content:space-between;margin-top:11px}.calendar-key span{display:flex;align-items:center;gap:6px}.calendar-key button{color:var(--gold2);font-weight:700}
    .key-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
    .mv{margin-top:12px;display:grid;gap:9px}
    .mv-row{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:10px}
    .mv-name{font-size:12px;font-weight:700;color:var(--ink2)}
    .mv-bar{position:relative;height:10px;border-radius:6px;background:rgba(var(--ink-rgb),.06);overflow:hidden}
    .mv-band{position:absolute;left:50%;width:50%;top:0;bottom:0;background:rgba(var(--ink-rgb),.05);border-left:1px solid rgba(var(--ink-rgb),.14)}
    .mv-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s ease}
    .mv-fill.good{background:var(--series)}.mv-fill.low{background:var(--faint)}.mv-fill.high{background:var(--risk)}
    .mv-num{text-align:right;font-size:12px;color:var(--muted)}
    .tracker-days{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:13px}
    .tracker-dot{height:18px;border-radius:6px;border:1px solid var(--line);background:rgba(var(--panel2-rgb),.75)}
    .tracker-dot.done{background:var(--series);border-color:var(--series)}
    .tracker-dot.missed{background:var(--riskDim);border-color:rgba(var(--risk-rgb),.4)}
    .tracker-dot.today{box-shadow:0 0 0 2px rgba(var(--gold-rgb),.4) inset}
    /* readiness gauge */
    .ready-band{position:relative;height:12px;border-radius:7px;overflow:hidden;display:flex;margin-top:13px}
    .rb-zone{height:100%}
    .rb-zone.z1{width:40%;background:rgba(var(--ink-rgb),.10)}
    .rb-zone.z2{width:25%;background:rgba(var(--ok-rgb),.34)}
    .rb-zone.z3{width:10%;background:rgba(var(--gold2-rgb),.32)}
    .rb-zone.z4{width:25%;background:rgba(var(--risk-rgb),.30)}
    .rb-marker{position:absolute;top:-1px;bottom:-1px;width:3px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 1.5px rgba(var(--bg-rgb),.8)}
    /* training block dots */
    .blk-dots{display:flex;gap:7px;margin-top:12px}
    .blk-dot{flex:1;height:20px;border-radius:7px;border:1px solid var(--line);background:rgba(var(--panel2-rgb),.75)}
    .blk-dot.past{background:var(--goldGhost);border-color:var(--goldDim)}
    .blk-dot.now{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(var(--gold-rgb),.35)}
    .blk-dot.dl{border-style:dashed}
    .blk-dot.now.dl{border-style:solid}

    /* ============ Workout ============ */
    .switcher{display:flex;gap:7px;margin-top:12px}
    .switch{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);padding:11px;font-family:var(--mono);font-weight:700;color:var(--muted);min-height:42px;transition:border-color .15s var(--e),background .15s var(--e)}
    .switch.active{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
    .prog{margin-top:14px}
    /* Signature: the loading barbell. Plates appear as the session fills. */
    .barload{display:flex;align-items:center;justify-content:center;gap:3px;padding:10px 0 4px}
    .barload .bar{flex:1;max-width:150px;height:5px;border-radius:3px;background:linear-gradient(180deg,var(--steel),var(--steel2));box-shadow:0 1px 0 rgba(0,0,0,.5)}
    .barload .collar{width:7px;height:15px;border-radius:2.5px;background:linear-gradient(180deg,var(--steel),var(--steel2))}
    .barload .plate{width:9px;border-radius:3px;background:var(--panel3);border:1px solid var(--line);transition:background .35s,border-color .35s,box-shadow .35s}
    .barload .p1{height:44px}.barload .p2{height:38px}.barload .p3{height:32px}.barload .p4{height:26px}.barload .p5{height:20px}
    .barload .plate.on{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);box-shadow:0 0 12px rgba(var(--gold-rgb),.35)}
    .note-echo{margin-top:12px;border-left:3px solid var(--goldDim)}
    .group{border:1px solid var(--line);border-radius:var(--r-lg);background:rgba(var(--bg2-rgb),.7);padding:13px;margin-top:15px}
    .group-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 3px 8px}
    .group-name{font-family:var(--disp);font-style:italic;font-weight:600;font-size:15.5px}
    .group-rule{color:var(--faint);font-size:11.5px;margin-top:2px}
    .round-btn{border:1px solid var(--goldDim);background:var(--goldGhost);color:var(--gold2);border-radius:999px;padding:9px 14px;font-weight:800;font-size:12px;white-space:nowrap;min-height:38px;transition:background .15s var(--e)}
    .exercise{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:14px;margin-top:10px}
    .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .ex-name{font-weight:800;font-size:15px}
    .ex-meta{color:var(--faint);font-size:11.5px;margin-top:3px}
    .tag{border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink2);font-family:var(--mono);font-size:11px;font-weight:700;padding:7px 11px;white-space:nowrap;transition:border-color .15s var(--e)}
    .media{margin-top:11px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--media-bg);position:relative;min-height:44px}
    .media img{display:block;width:100%;max-height:210px;object-fit:contain;background:transparent;filter:invert(1) hue-rotate(180deg) contrast(1.04);mix-blend-mode:screen}
    .media-fallback{display:none;padding:12px;color:var(--faint);font-size:12px}
    .media.failed{background:var(--panel2)}
    .media.failed .media-fallback{display:block;color:var(--faint)}
    .range{margin-top:11px}
    .range .bar{height:7px;border-radius:5px;background:rgba(var(--ink-rgb),.07);overflow:hidden}
    .range .fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s ease}
    .range .fill.earned{background:var(--gold2)}
    .bar-labs{display:flex;justify-content:space-between;color:var(--faint);font-size:10.5px;margin-top:5px}
    .step-grid{margin-top:12px}
    .step-label{color:var(--faint);font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:800}
    .step-controls{display:flex;align-items:center;gap:8px;margin-top:6px}
    .step-btn{width:46px;height:46px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2);font-size:20px;font-weight:700;color:var(--ink2);flex:0 0 auto;transition:border-color .15s var(--e),background .15s var(--e)}
    .step-val,.num-in{flex:1;text-align:center;font-family:var(--mono);font-weight:700;font-size:18px;border:1px solid var(--line);background:var(--panel2);border-radius:var(--r-sm);padding:10px 6px;min-width:0;-moz-appearance:textfield}
    .num-in::-webkit-outer-spin-button,.num-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .plates{margin-top:7px}
    .set-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
    .mini-btn{border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--ink2);font-size:11.5px;font-weight:700;padding:9px 13px;min-height:44px;transition:border-color .15s var(--e),background .15s var(--e)}
    .mini-btn.gold{border-color:var(--goldDim);color:var(--gold2);background:var(--goldGhost)}
    .mini-btn.danger{border-color:rgba(var(--risk-rgb),.35);color:var(--risk)}
    .warmup-box{margin-top:11px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px}
    .warmup-title{color:var(--faint);font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:800;margin-bottom:7px}
    .warmrow{display:grid;grid-template-columns:44px 1fr 1fr 64px;gap:7px;align-items:center;margin-top:6px}
    .warm-step{display:flex;align-items:center;gap:4px}
    .warm-step button{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink2);font-weight:700}
    .warm-val{flex:1;text-align:center;font-size:13px}
    .warm-log{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-weight:800;font-size:11.5px;color:var(--ink2)}
    .warm-log.is-done{background:var(--okDim);border-color:rgba(var(--ok-rgb),.45);color:var(--ok)}
    .setlog-head{display:flex;justify-content:space-between;color:var(--faint);font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:800;margin-top:13px}
    .setlog{margin-top:7px;display:grid;gap:7px}
    .setrow{display:grid;grid-template-columns:52px 46px 1fr 86px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:rgba(var(--bg2-rgb),.55);padding:8px;transition:border-color .2s var(--e),background .2s var(--e)}
    .setrow.adv{grid-template-columns:46px 42px 1fr 48px 78px}
    .setrow.done{border-color:rgba(var(--ok-rgb),.4);background:rgba(var(--ok-rgb),.06)}
    .setn{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:700;white-space:nowrap;min-width:0;font-variant-numeric:tabular-nums}
    .prev{font-family:var(--mono);font-size:10px;color:var(--faint);line-height:1.35;text-align:center}
    .rep-step{display:flex;align-items:center;gap:6px}
    .rep-step .step-btn{width:44px;height:44px;font-size:17px}
    .rep-val{font-size:16px;padding:8px 4px}
    .rpe-btn{height:42px;border:1px dashed var(--line);border-radius:var(--r-sm);background:transparent;color:var(--faint);font-family:var(--mono);font-weight:700;font-size:11px;transition:border-color .15s var(--e),color .15s var(--e)}
    .rpe-btn.on{border-style:solid;border-color:var(--goldDim);color:var(--gold2);background:var(--goldGhost)}
    .set-log{min-height:44px;height:44px;border:1px solid var(--goldDim);border-radius:var(--r-sm);background:var(--goldGhost);color:var(--gold2);font-weight:800;font-size:12.5px;transition:background .15s var(--e)}
    .set-log.is-done{background:var(--okDim);border-color:rgba(var(--ok-rgb),.5);color:var(--ok)}
    /* Disclosure: quiet until asked. The summary row is a label, not a button. */
    .ex-panel{margin-top:12px;border-top:1px solid var(--soft)}
    .ex-panel+.ex-panel{margin-top:0}
    .ex-panel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 2px 3px;color:var(--faint);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:800;transition:color .15s var(--e)}
    .ex-panel>summary::-webkit-details-marker{display:none}
    .ex-panel>summary::marker{content:""}
    .ex-panel>summary:after{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translate(-1px,-1px);transition:transform .18s var(--e)}
    .ex-panel[open]>summary:after{transform:rotate(-135deg) translate(-2px,-2px)}
    .ex-panel>summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
    .ex-panel-body{padding-bottom:4px}
    .ex-panel .set-actions{margin-top:8px}
    .ex-panel .cues{margin-top:10px}
    @media (hover:hover){.ex-panel>summary:hover{color:var(--ink2)}}
    .cues{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.55}
    .cues ul{margin:6px 0 0;padding-left:17px}
    /* ---- coaching layer: how to do the movement, and what makes it grow ---- */
    .coach{margin-top:13px;display:grid;gap:1px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
    .coach-block{background:var(--panel);padding:11px 12px 12px}
    .coach-h{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:var(--faint);margin-bottom:6px}
    .coach-block ul{margin:0;padding-left:16px;color:var(--ink2);font-size:12.5px;line-height:1.62}
    .coach-block li+li{margin-top:5px}
    .coach-block li::marker{color:var(--faint)}
    .coach-block.grow{background:var(--goldGhost);box-shadow:inset 2px 0 0 var(--gold)}
    .coach-block.grow .coach-h{color:var(--gold2)}
    .coach-block.grow ul{color:var(--ink)}
    .coach-block.grow li::marker{color:var(--gold)}
    .coach-block.warn{box-shadow:inset 2px 0 0 var(--risk)}
    .coach-block.warn .coach-h{color:var(--risk)}
    .coach-block.warn li::marker{color:var(--risk)}
    /* ---- same-stimulus alternatives ---- */
    .alt-list{display:grid;gap:8px}
    .alt-card{display:grid;grid-template-columns:64px 1fr;gap:11px;align-items:center;text-align:left;width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);transition:border-color .15s var(--e),background .15s var(--e)}
    .alt-card[disabled]{opacity:.42}
    @media (hover:hover){.alt-card:not([disabled]):hover{border-color:var(--goldDim);background:var(--panel2)}}
    .alt-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    .alt-media{display:block;height:52px;border-radius:8px;overflow:hidden;background:var(--media-bg);border:1px solid var(--line)}
    .alt-media img{display:block;width:100%;height:100%;object-fit:contain;filter:invert(1) hue-rotate(180deg) contrast(1.04);mix-blend-mode:screen}
    .alt-copy{display:grid;gap:3px;min-width:0}
    .alt-name{font-weight:800;font-size:12.5px;line-height:1.3;color:var(--ink)}
    .alt-meta{font-size:11px;color:var(--muted);text-transform:capitalize}
    /* ---- swap tiers: direct / near / everything else ---- */
    .swap-tier+.swap-tier{margin-top:14px}
    .swap-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800}
    .swap-h span{font-size:11px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--muted)}
    .swap-h.direct{color:var(--gold2)}
    .swap-h.near{color:var(--ink2)}
    .swap-h.other{color:var(--faint)}
    /* ---- last-set guidance ---- */
    .setn-tag{display:block;font-size:8px;letter-spacing:.7px;font-weight:800;margin-top:2px}
    .setn-tag.go{color:var(--gold2)}
    .setn-tag.hold{color:var(--muted)}
    .setrow.to-failure{box-shadow:inset 2px 0 0 var(--gold)}
    .failure-note{margin-top:9px;font-size:11.5px;line-height:1.5;color:var(--muted);padding-left:10px;border-left:2px solid var(--line2)}
    .failure-note.go{color:var(--ink2);border-left-color:var(--gold)}
    .extra-card{border-color:var(--goldDim)}
    .alt-card.direct{border-color:var(--goldDim)}
    .alt-card.near{border-style:dashed}
    .secondary.block{width:100%}
    /* ---- coached program chooser ---- */
    .demo-note{margin-top:11px;padding:10px 12px;border:1px dashed var(--line2);border-radius:var(--r-md);background:var(--bg2)}
    .demo-note p{margin:0;color:var(--ink2);font-size:12.5px;line-height:1.6}
    .preset{margin-top:10px;border:1px solid var(--line)}
    .preset.is-on{border-color:var(--goldDim);background:var(--goldGhost)}
    .pill.gold{background:var(--goldGhost);color:var(--gold2);border-color:var(--goldDim);padding:2px 8px;font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;font-family:inherit;font-weight:800;min-width:0;vertical-align:2px}
    .notes{min-height:84px;margin-top:4px;resize:vertical}
    .restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;width:min(92vw,560px);display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--goldDim);border-radius:var(--r-md);background:rgba(var(--panel-rgb),.97);box-shadow:0 20px 46px var(--shadow);padding:11px 14px;backdrop-filter:blur(10px)}
    .resttime{font-size:24px;font-weight:700;line-height:1;margin-top:2px}
    .rest-actions{display:flex;gap:7px}
    .restbtn{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel2);color:var(--ink2);font-weight:800;font-size:13px;padding:10px 12px;min-height:42px}
    .restbtn.skip{border-color:var(--goldDim);color:var(--gold2)}
    .rest-ring{transform:rotate(-90deg);flex:0 0 auto}
    .rest-ring .rt{stroke:var(--soft);fill:none;stroke-width:6}
    .rest-ring .rp{stroke:var(--gold2);fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
    .restbar .rest-left{display:flex;align-items:center;gap:13px}
    .finish-bar{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(var(--bg-bot-rgb),.94) 34%)}
    .finish-inner{max-width:620px;margin:0 auto}
    .finish{display:block;width:100%;border-radius:var(--r-md);padding:15px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);font-weight:800;font-size:15.5px;box-shadow:0 14px 30px rgba(var(--gold-rgb),.24);min-height:50px;transition:filter .15s var(--e)}

    /* ============ Report ============ */
    .report-hero{text-align:left}
    .report-grade{font-family:var(--disp);font-weight:700;font-size:88px;line-height:.9;color:var(--m3);margin-top:6px}
    .report-grade.good{color:var(--m5)}
    .report-narr{margin-top:10px;color:var(--ink2);font-size:14px;line-height:1.55;max-width:48ch}
    .report-sub{margin-top:9px;color:var(--muted);font-size:12px}
    .pr{margin-top:12px;border:1px solid var(--goldDim);border-radius:var(--r-sm);background:var(--goldGhost);padding:11px 13px;font-size:12.5px;line-height:1.5}
    .feedback{margin-top:14px;position:relative}
    .feedback-title{font-family:var(--disp);font-style:italic;font-weight:600;font-size:15px}
    .feedback-list{margin:8px 0 0;padding-left:19px;color:var(--muted);font-size:12.5px;line-height:1.6}
    .feedback-list li{margin-top:5px}

    /* ============ Charts / stats ============ */
    /* Chart hosts are measured at paint time; the SVG inside is drawn 1:1, so
       stroke weight and axis type stay honest from 390px to 1440px. */
    .chart-host{width:100%;height:168px;display:block}
    .chart-host.tall{height:206px}
    .chart-empty{color:var(--faint);font-size:12.5px;padding:14px 2px}
    .chart{width:100%;height:100%;display:block;overflow:visible}
    .chart .grid{stroke:var(--gridline);stroke-width:1}
    .chart .goal-line{stroke:var(--gold2);stroke-dasharray:3 5;opacity:.5}
    .chart .area{fill:url(#ag)}
    /* pathLength="1" normalises the draw-on animation to any real width */
    .chart .line{fill:none;stroke:url(#lg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--e) forwards}
    .chart .line.thin{stroke-width:1.8}
    .chart .dotp{fill:var(--gold2)}
    .chart .ax{fill:var(--faint);font-size:10px;font-family:var(--mono);letter-spacing:.3px}
    .chart .ax.gold{fill:var(--goldDim);font-weight:700}
    .chart .fcast{fill:none;stroke:var(--gold2);stroke-width:1.8;stroke-dasharray:4 4;opacity:.65}
    .chart .fband{fill:var(--seriesGhost)}
    .chart .fit{fill:none;stroke:var(--series2);stroke-width:1.4;opacity:.55}
    .stat-row{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--soft);transition:background .15s var(--e)}
    .stat-row:last-child{border-bottom:0}
    .stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .stat-name{font-weight:800;font-size:13.5px}
    .stat-num{font-family:var(--mono);font-weight:700;font-size:17px}
    .stat-bar{position:relative;height:9px;border-radius:6px;background:rgba(var(--ink-rgb),.06);margin-top:9px;overflow:visible}
    .stat-average{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:rgba(var(--ink-rgb),.14)}
    .stat-current{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--series)}
    .stat-goal{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--ink2);border-radius:2px}

    /* ============ History / forms / program ============ */
    .search{margin-top:12px}
    .month-head{margin:15px 0 3px;font-family:var(--disp);font-style:italic;color:var(--ink2);font-size:14.5px}
    .session-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}
    .formgrid.full{grid-template-columns:1fr}
    .field label{display:block;color:var(--faint);font-size:10px;letter-spacing:.9px;text-transform:uppercase;font-weight:800;margin-bottom:5px}
    .program-slot{margin-top:10px}
    .slot-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .chip{border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-size:11.5px;font-weight:700;padding:8px 12px;min-height:36px;transition:border-color .15s var(--e),background .15s var(--e)}
    .chip.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
    .bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
    .bank-card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:9px;text-align:left;display:grid;gap:7px;transition:border-color .15s var(--e),transform .12s var(--e)}
    .bank-card.in-plan{opacity:.45}
    .bank-media{display:block;border-radius:9px;overflow:hidden;background:var(--media-bg);border:1px solid var(--line);min-height:86px}
    .bank-media img{display:block;width:100%;height:106px;object-fit:contain;background:transparent;filter:invert(1) hue-rotate(180deg) contrast(1.04);mix-blend-mode:screen}
    .bank-name{font-weight:800;font-size:12.5px;line-height:1.3}
    .bank-meta{color:var(--faint);font-size:10.5px}

    /* ============ Achievements / data ============ */
    .ach{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-md);background:rgba(var(--panel-rgb),.8);padding:12px 14px;margin-top:8px;opacity:.62}
    .ach.unlocked{opacity:1;border-color:var(--goldDim);background:linear-gradient(160deg,rgba(var(--gold-rgb),.1),rgba(var(--panel-rgb),.9))}
    .ach-title{font-weight:800;font-size:13px}
    .ach-sub{color:var(--faint);font-size:11.5px;margin-top:2px}
    .ach-side{text-align:right;flex:0 0 auto}
    .ach-pts{font-family:var(--mono);color:var(--gold2);font-weight:700;font-size:12px}
    .ach-badge{color:var(--faint);font-size:10.5px;margin-top:3px}
    .backup-warn{border-color:rgba(var(--risk-rgb),.4)}
    .backup-ok{border-color:rgba(var(--ok-rgb),.3)}

    /* ============ Confirm overlay ============ */
    .confirm-overlay{position:fixed;inset:0;z-index:300;background:var(--scrim);backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px}
    .confirm-box{width:min(94vw,420px);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel2);box-shadow:0 30px 80px var(--shadow);padding:19px;animation:fade .18s var(--e)}
    .confirm-title{font-family:var(--disp);font-weight:600;font-size:19px;margin-top:7px}
    .confirm-text{color:var(--muted);font-size:13px;line-height:1.55;margin-top:8px}
    .confirm-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}

    /* ============ Portfolio / analyst ============ */
    .rating{border:1px solid currentColor;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
    .pos-row{display:block;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--soft);transition:background .15s var(--e)}
    .pos-row:last-child{border-bottom:0}
    .pos-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .pos-name{font-weight:800;font-size:13.5px}
    .pos-meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px}
    .pos-meta b{color:var(--ink2);font-weight:700}
    .pos-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 10px;margin-top:11px}
    .pstat .v{font-family:var(--mono);font-weight:700;font-size:14px}
    .pstat .k{font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);font-weight:800;margin-top:2px}
    .alloc-row{display:grid;grid-template-columns:66px 1fr 76px;align-items:center;gap:10px;margin-top:9px}
    .alloc-name{font-size:12px;font-weight:700;color:var(--ink2)}
    .alloc-bar{position:relative;height:10px;border-radius:6px;background:rgba(var(--ink-rgb),.06);overflow:hidden}
    .alloc-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--gold2);transition:width .5s ease}
    .alloc-fill.under{background:var(--faint)}
    .alloc-target{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink2);border-radius:2px}
    .alloc-num{text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted)}
    .note-head{font-family:var(--disp);font-weight:600;font-style:italic;font-size:16px;color:var(--ink2);margin-bottom:2px}

    /* ============ First run ============ */
    .firstrun{border:1px solid var(--goldDim);border-radius:22px;background:linear-gradient(158deg,rgba(var(--gold-rgb),.14),rgba(var(--panel-rgb),.9));padding:26px 20px;text-align:center;position:relative;overflow:hidden;margin-top:14px}
    .firstrun:before{content:"";position:absolute;inset:-50% 55% auto -20%;height:240px;background:radial-gradient(circle,rgba(var(--gold-rgb),.16),transparent 70%);pointer-events:none}
    .firstrun .fr-title{font-family:var(--disp);font-weight:600;font-size:25px;margin:10px 0 6px;position:relative}
    .firstrun p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 auto;max-width:34ch;position:relative}
    .firstrun .primary{margin-top:16px;position:relative}

    /* ============ Motion ============ */
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    @keyframes grow{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
    .shell{animation:fade .28s var(--e)}
    .radar-cur{transform-box:fill-box;transform-origin:center;animation:grow .55s var(--e)}
    button{transition:transform .12s var(--e)}
    button:active{transform:scale(.97)}
    @media (prefers-reduced-motion:reduce){.shell,.chart .line,.radar-cur,button{animation:none!important;transition:none!important}}

    /* ============ Hover states (pointer devices) ============ */
    @media (hover:hover){
      .primary:hover,.finish:hover{filter:brightness(1.07)}
      .secondary:hover,.mini-btn:hover,.restbtn:hover,.step-btn:hover,.chip:hover{border-color:var(--line2);background:var(--panel3)}
      .secondary.gold:hover,.mini-btn.gold:hover{border-color:var(--gold);background:rgba(var(--gold-rgb),.2)}
      .secondary.danger:hover,.mini-btn.danger:hover{border-color:var(--risk)}
      .tool:hover,.day:hover,.bank-card:not(.in-plan):hover,.today-cta:hover{border-color:var(--line2);transform:translateY(-1px)}
      .day:hover,.today-cta:hover{border-color:var(--goldDim)}
      .stat-row:hover,.pos-row:hover{background:rgba(var(--ink-rgb),.025)}
      .nav button:hover{color:var(--ink2)}
      .nav button.active:hover{color:var(--gold2)}
      .back:hover{color:var(--ink)}
      .tag:hover{border-color:var(--goldDim)}
      .switch:hover:not(.active){border-color:var(--line2);background:var(--panel2)}
      .sync-chip:hover{border-color:var(--line2)}
      .rpe-btn:hover{border-color:var(--goldDim);color:var(--gold2)}
    }

    /* ============ Narrow phones ============ */
    @media (max-width:430px){
      .formgrid{grid-template-columns:repeat(2,1fr)}
      .tool-grid{grid-template-columns:1fr 1fr}
      .level{font-size:50px}
      /* The rep number is the most-read value on this screen. Give it the
         slack: trim the label columns so the stepper's input keeps real width
         instead of collapsing to a sliver between the two buttons. */
      .setrow{grid-template-columns:40px 34px minmax(0,1fr) 66px;gap:5px}
      .setrow.adv{grid-template-columns:30px 26px minmax(0,1fr) 38px 52px;gap:4px}
      .setrow.adv .rep-step .step-btn{width:44px;height:44px}
      .setrow.adv .rep-step{gap:4px}
      .setn{font-size:9px}
      .prev{font-size:9px}
      .rep-step .step-btn{width:36px}
      .rep-step{gap:5px}
      .level-head>.pill{flex:0 0 auto}
      .exercise{padding:13px 11px}
      .ex-head{align-items:center}
      .ex-name{font-size:14px}
      .media img{max-height:170px}
      .mini-btn{padding:8px 10px}
      .calendar-card{padding:14px 12px}
      .calendar-title{display:block}
      .calendar-nav{justify-content:space-between;margin-top:11px}
      .calendar-weekdays,.training-calendar{gap:4px}
      .cal-day{border-radius:8px;font-size:10px}
    }

    /* ============ Desktop / laptop: sidebar + multi-column ============ */
    @media (min-width:1080px){
      :root{--sbw:264px;--desk-pad:clamp(28px,3vw,58px)}
      body{
        background:
          linear-gradient(90deg,rgba(var(--ink-rgb),.025) 1px,transparent 1px),
          linear-gradient(180deg,rgba(var(--ink-rgb),.018) 1px,transparent 1px),
          radial-gradient(ellipse 56% 30% at 30% -8%,rgba(var(--gold-rgb),.12),transparent),
          radial-gradient(ellipse 40% 24% at 100% 1%,rgba(var(--ink-rgb),.035),transparent),
          linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);
        background-size:48px 48px,48px 48px,auto,auto,auto;
        background-attachment:fixed;
      }
      body:before{content:"";position:fixed;left:0;top:0;bottom:0;width:var(--sbw);background:linear-gradient(180deg,var(--sidebar-top),var(--sidebar-bot));border-right:1px solid var(--line);box-shadow:18px 0 56px rgba(0,0,0,.22);z-index:40}
      .shell{width:100%;max-width:none;margin:0;min-height:100vh;padding:28px var(--desk-pad) 72px calc(var(--sbw) + var(--desk-pad))}
      .shell.has-finish{padding-bottom:132px}
      /* head → sidebar top */
      .head{position:fixed;left:0;top:0;width:var(--sbw);margin:0;padding:26px 20px 14px;background:none;backdrop-filter:none;z-index:50}
      .appbar{flex-direction:column;align-items:stretch;gap:18px;padding:0}
      .brand{align-items:center}
      .mark{width:46px;height:46px;border-radius:14px}
      .mark svg{width:27px;height:27px}
      .bt{font-size:22px}
      .sync-chip{padding:5px 10px}
      .ovr-mini{align-self:stretch;justify-content:space-between;padding:11px 14px;background:rgba(var(--panel-rgb),.72)}
      .ovr-mini b{font-size:22px}
      /* nav → sidebar rail */
      .nav{left:0;right:auto;top:170px;bottom:auto;width:var(--sbw);flex-direction:column;gap:5px;padding:10px 14px;border:0;background:none;backdrop-filter:none;z-index:50}
      .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:13px;font-weight:700;letter-spacing:0;border-radius:11px;min-height:46px;color:var(--muted)}
      .nav button svg{width:21px;height:21px}
      .nav button .nav-l{font-size:13px}
      .nav button.active{color:var(--gold2);background:var(--goldGhost);box-shadow:inset 2.5px 0 0 var(--gold)}
      .nav--session{display:flex}
      /* content grids */
      .home-grid{display:grid;grid-template-columns:minmax(390px,.82fr) minmax(520px,1.18fr);gap:24px;align-items:start}
      .hg-main{position:sticky;top:28px;align-self:start}
      .hg-side{column-count:2;column-gap:16px}
      .hg-side>*{break-inside:avoid;margin-top:0;margin-bottom:16px}
      .hg-side>.grid3{column-span:all}
      .hg-side>.grid3 .metric{padding:16px 14px}
      .duo{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,1.05fr);gap:18px;align-items:start}
      .groups-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
      .tool-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
      .rot-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
      .grid3,.grid2{gap:14px}
      .bank-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
      .formgrid{grid-template-columns:repeat(6,1fr)}
      .formgrid.full{grid-template-columns:1fr 1fr}
      .title{font-size:38px}
      .level{font-size:76px;letter-spacing:-1px}
      .hero{padding:28px;border-radius:18px;background:linear-gradient(150deg,var(--hero-desk-top),var(--hero-desk-bot));box-shadow:0 28px 76px rgba(0,0,0,.34),inset 0 1px 0 rgba(var(--ink-rgb),.05)}
      .hero:before{right:-58px;top:-70px;width:220px;height:220px}
      .card{padding:18px;border-radius:16px}
      .section{margin:28px 2px 12px}
      .day{min-height:104px;padding:16px}
      .tool{min-height:132px;padding:17px}
      .tool strong{font-size:14px}
      .tool span{font-size:12px}
      .metric{padding:15px 13px}
      .num{font-size:25px}
      .lab{letter-spacing:.7px}
      .report-grade{font-size:104px}
      /* fixed bars respect the sidebar */
      .finish-bar{left:var(--sbw)}
      .finish-inner{max-width:640px}
      .restbar{left:calc(50% + var(--sbw)/2)}
      .toast{left:calc(50% + var(--sbw)/2)}
      .chart-host{height:210px}
      .chart-host.tall{height:260px}
      .notes{min-height:100px}
      .media img{max-height:250px}
    }
    @media (min-width:1500px){
      :root{--sbw:276px}
      .home-grid{grid-template-columns:minmax(430px,.78fr) minmax(720px,1.22fr);gap:28px}
      .tool-grid{grid-template-columns:repeat(7,minmax(0,1fr))}
      .bank-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
      .groups-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    /* mid-size screens: breathe a little wider, keep phone layout */
    @media (min-width:700px) and (max-width:1079px){
      .shell{max-width:680px}
      .tool-grid{grid-template-columns:repeat(3,1fr)}
      .bank-grid{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--gold2)"/></linearGradient>
    <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(var(--gold-rgb),.22)"/><stop offset="1" stop-color="rgba(var(--gold-rgb),0)"/></linearGradient>
  </defs></svg>
  <script src="app.js"></script>
</body>
</html>
